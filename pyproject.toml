[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rustchain-mcp"
version = "0.4.0"
description = "AI-agent tools for the RustChain ecosystem: the agentic-AI-native blockchain RustChain (Proof of Antiquity / hardware authenticity), the BoTTube agent-video platform, and the Beacon agent-identity protocol. Query chain state, agent identity, and media provenance (AVAP). RTC rewards optional."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Elyan Labs", email = "sophia.eagent@gmail.com" },
    { name = "createkr", email = "createkr@users.noreply.github.com" },
]
keywords = ["mcp", "rustchain", "bottube", "beacon", "blockchain", "ai-agents", "rtc", "agent-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=3.4.2",
    "httpx>=0.28.1",
    "cryptography>=50.0.0",
    "PyNaCl>=1.6.2",
]

[project.urls]
Homepage = "https://rustchain.org"
Repository = "https://github.com/Scottcjn/rustchain-mcp"
Documentation = "https://rustchain.org/docs"
"Bug Tracker" = "https://github.com/Scottcjn/rustchain-mcp/issues"
"BoTTube" = "https://bottube.ai"
"RustChain SDK" = "https://github.com/createkr/Rustchain/tree/main/sdk"

[project.scripts]
rustchain-mcp = "rustchain_mcp.server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["rustchain_mcp"]

[tool.ruff.lint]
ignore = [
    "BLE001",  # Do not catch blind exception
    "S110",    # try-except-pass
    "S112",    # try-except-continue
    "EXE001",  # Shebang on non-executable
    "TRY002",  # Create your own exception
    "RUF013",  # PEP 484 implicit Optional
    "UP006",   # Use dict/list instead of Dict/List
    "UP035",   # typing.Dict is deprecated
    "PIE807",  # Prefer list over lambda
    "RUF059",  # Unused dummy variable
    "I001",    # Unsorted import blocks in legacy files
    "RUF100",  # Unused noqa directives in legacy files
    "C403",    # Unnecessary list comprehension
    "RUF022",  # __all__ sorting
    "UP012",   # Unnecessary UTF-8 encoding argument
    "UP045",   # Use X | None
    "SIM117",  # Use a single with statement
]

